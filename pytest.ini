[pytest]
testpaths = suites
python_files =
    test_server_http_conformance.py
    test_server_contract_conventions.py
    test_evidence_conformance_api.py
    test_project_conformance.py
    test_library_conformance.py
    test_server_contract_evidence.py
    test_server_contract_projects.py
    test_server_contract_calls.py
    test_server_load.py
# Only the cases that talk to a server: the suites' other cases check the app's own storages.
addopts = -m servers -ra
